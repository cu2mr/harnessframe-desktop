<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="whaleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="6"/>

  <!-- Glowing Geometric Rings representing Harness / Engine -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="4" stroke-dasharray="12 8"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="rgba(56, 189, 248, 0.4)" stroke-width="3"/>

  <!-- Central DeepSeek Whale / AI Spark Core Icon -->
  <g filter="url(#glow)">
    <!-- Whale Body -->
    <path d="M 160 270 C 160 210, 220 180, 280 180 C 340 180, 370 220, 370 260 C 370 300, 330 330, 270 330 C 230 330, 190 310, 160 270 Z" fill="url(#whaleGrad)"/>
    <!-- Tail Fin -->
    <path d="M 170 265 C 130 240, 110 210, 115 195 C 125 215, 145 235, 175 255 Z" fill="#38bdf8"/>
    <path d="M 170 265 C 130 280, 110 315, 115 325 C 125 305, 145 285, 175 270 Z" fill="#0284c7"/>
    <!-- Eye Spark -->
    <circle cx="330" cy="240" r="8" fill="#0f172a"/>
    <circle cx="332" cy="238" r="3" fill="#ffffff"/>
    <!-- Harness Spurt Sparkle -->
    <path d="M 290 155 L 295 135 L 305 135 L 295 160 Z" fill="#38bdf8"/>
    <path d="M 310 160 L 325 140 L 335 145 L 315 165 Z" fill="#7dd3fc"/>
  </g>
</svg>
